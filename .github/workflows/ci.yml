name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: belong_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/belong_test
      - run: npm run build
      - name: Install Chromium for the browser test
        run: npx playwright install --with-deps chromium
      - name: Browser journey (every page, desktop and phone)
        run: |
          rm -f data/e2e.db*
          DATABASE_FILE=./data/e2e.db PORT=3100 APP_URL=http://localhost:3100 BELONG_INSECURE_COOKIES=true npm start > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3100/api/health > /dev/null && break; sleep 1; done
          BASE_URL=http://localhost:3100 npm run test:e2e
      - name: Keep screenshots and server log if the browser test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            e2e-screenshots/
            server.log
